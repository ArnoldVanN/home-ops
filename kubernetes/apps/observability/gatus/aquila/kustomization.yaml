---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namePrefix: aquila-
resources:
  - ../base
  - ./discord-webhook.sops.yaml
  - ./ingress.yaml
configMapGenerator:
  - name: gatus-config
    files:
      - ./config.yaml
generatorOptions:
  disableNameSuffixHash: true
# The home-ops instance owns app=gatus, and Deployment selectors are immutable
patches:
  - target:
      kind: Deployment
      name: gatus
    patch: |-
      - op: replace
        path: /spec/selector/matchLabels/app
        value: aquila-gatus
      - op: replace
        path: /spec/template/metadata/labels/app
        value: aquila-gatus
  - target:
      kind: Service
      name: gatus
    patch: |-
      - op: replace
        path: /spec/selector/app
        value: aquila-gatus
