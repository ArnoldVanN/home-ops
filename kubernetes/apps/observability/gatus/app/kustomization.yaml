kind: Kustomization
resources:
  - ./discord-webhook.sops.yaml
  - ./pvc.yaml
  - ./deployment.yaml
  - ./service.yaml
  - ./ingress.yaml
configMapGenerator:
  - name: gatus-config
    files:
      - ./config.yaml
generatorOptions:
  disableNameSuffixHash: true
