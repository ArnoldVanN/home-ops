storage:
  type: sqlite
  path: /data/data.db

ui:
  title: Status | home-ops
  header: home-ops
  dashboard-heading: Status
  dashboard-subheading: Uptime of the sites hosted on home-ops
  default-sort-by: group
  # Colours from arnovannieuwenhuyzen.com's theme (converted from OKLCH)
  # custom.css loads before Gatus' own CSS, hence the extra specificity
  custom-css: |
    html:root {
      --background: 0 0% 100%;
      --foreground: 0 0% 3.9%;
      --card: 0 0% 100%;
      --card-foreground: 0 0% 3.9%;
      --popover: 0 0% 100%;
      --popover-foreground: 0 0% 3.9%;
      --primary: 276 100% 42.9%;
      --primary-foreground: 270 99% 98%;
      --secondary: 240 4% 95.8%;
      --secondary-foreground: 240 6% 10%;
      --muted: 0 0% 96.1%;
      --muted-foreground: 0 0% 45.2%;
      --accent: 276 100% 42.9%;
      --accent-foreground: 270 99% 98%;
      --destructive: 357 100% 45.3%;
      --border: 0 0% 89.8%;
      --input: 0 0% 89.8%;
      --ring: 0 0% 63%;
      --radius: 0rem;
    }
    html:root.dark {
      --background: 0 0% 3.9%;
      --foreground: 0 0% 98%;
      --card: 0 0% 9.1%;
      --card-foreground: 0 0% 98%;
      --popover: 0 0% 9.1%;
      --popover-foreground: 0 0% 98%;
      --primary: 275 82% 37.9%;
      --primary-foreground: 270 99% 98%;
      --secondary: 240 4% 15.9%;
      --secondary-foreground: 0 0% 98%;
      --muted: 0 0% 14.9%;
      --muted-foreground: 0 0% 63%;
      --accent: 275 82% 37.9%;
      --accent-foreground: 270 99% 98%;
      --destructive: 359 100% 69.6%;
      --border: 0 0% 13.5%;
      --input: 0 0% 18.3%;
      --ring: 0 0% 45.2%;
    }

# Covers the k3s upgrade (03:00-05:00) and kured reboot (05:00-07:00) windows.
maintenance:
  start: "03:00"
  duration: 4h
  timezone: Europe/Brussels

alerting:
  discord:
    webhook-url: "${DISCORD_WEBHOOK_URL}"
    default-alert:
      failure-threshold: 3
      success-threshold: 2
      send-on-resolved: true

endpoints:
  - name: arnovannieuwenhuyzen.com
    group: sites
    url: https://arnovannieuwenhuyzen.com
    interval: 5m
    conditions:
      - "[STATUS] == 200"
      - "[CERTIFICATE_EXPIRATION] > 168h"
    alerts:
      - type: discord

  - name: greetvandewynckele.com
    group: sites
    url: https://greetvandewynckele.com
    interval: 5m
    conditions:
      - "[STATUS] == 200"
      - "[CERTIFICATE_EXPIRATION] > 168h"
    alerts:
      - type: discord

  # In-cluster checks, to tell an app outage apart from a tunnel outage.
  - name: portfolio
    group: cluster
    url: http://portfolio-svc.web.svc.cluster.local
    interval: 1m
    ui: &internal-ui
      hide-hostname: true
      hide-url: true
      hide-port: true
      hide-errors: true
    conditions:
      - "[STATUS] == 200"

  - name: greetvandewynckele
    group: cluster
    url: http://greetvandewynckele-svc.web.svc.cluster.local
    interval: 1m
    ui: *internal-ui
    conditions:
      - "[STATUS] == 200"

  - name: flux
    group: cluster
    url: http://flux-operator.flux-system.svc.cluster.local:9080
    interval: 5m
    ui: *internal-ui
    conditions:
      - "[STATUS] == 200"
