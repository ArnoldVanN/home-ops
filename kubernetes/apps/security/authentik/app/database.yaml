---
# Single-instance Postgres for authentik. CloudNativePG creates the
# `authentik-db-app` secret (username, password, host, dbname, uri) and the
# `authentik-db-rw` service.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: authentik-db
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:18.6-standard-trixie
  bootstrap:
    initdb:
      database: authentik
      owner: authentik
  storage:
    storageClass: local-path
    size: 5Gi
