apiVersion: fluxcd.controlplane.io/v1
kind: ResourceSet
metadata:
  name: static-sites
  namespace: web
spec:
  inputs:
    - name: portfolio
      namespace: web
      repository: ghcr.io/arnoldvann/portfolio
      host: arnovannieuwenhuyzen.com
      tag: main-89de5a2-1792706166 # {"$imagepolicy": "flux-system:portfolio:tag"}
    - name: greetvandewynckele
      namespace: web
      repository: ghcr.io/arnoldvann/greetvandewynckele
      host: greetvandewynckele.com
      tag: main-f7039b5-1783095703 # {"$imagepolicy": "flux-system:greetvandewynckele:tag"}
    - name: seer-docs
      namespace: web
      repository: ghcr.io/arnoldvann/seer-docs
      host: seer.arnovannieuwenhuyzen.com
      tag: main-0b51007-1793292960 # {"$imagepolicy": "flux-system:seer-docs:tag"}
  resources:
    - apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: << inputs.name >>
        namespace: << inputs.namespace >>
        labels:
          app: << inputs.name >>
      spec:
        replicas: 2
        selector:
          matchLabels:
            app: << inputs.name >>
        template:
          metadata:
            labels:
              app: << inputs.name >>
          spec:
            containers:
              - name: << inputs.name >>
                image: << inputs.repository >>:<< inputs.tag >>
                ports:
                  - containerPort: 8080
    - apiVersion: v1
      kind: Service
      metadata:
        name: << inputs.name >>-svc
        namespace: << inputs.namespace >>
      spec:
        type: ClusterIP
        selector:
          app: << inputs.name >>
        ports:
          - protocol: TCP
            port: 80
            targetPort: 8080
    - apiVersion: networking.k8s.io/v1
      kind: Ingress
      metadata:
        name: << inputs.name >>
        namespace: << inputs.namespace >>
        annotations:
          external-dns.kubernetes.io/target: 3b83224e-a7be-4784-8b8d-bce9c10d1589.cfargotunnel.com
      spec:
        ingressClassName: traefik
        rules:
          - host: << inputs.host >>
            http:
              paths:
                - path: /
                  pathType: Prefix
                  backend:
                    service:
                      name: << inputs.name >>-svc
                      port:
                        number: 80
    - apiVersion: image.toolkit.fluxcd.io/v1
      kind: ImageRepository
      metadata:
        name: << inputs.name >>
        namespace: flux-system
      spec:
        image: << inputs.repository >>
        interval: 5m
    - apiVersion: image.toolkit.fluxcd.io/v1
      kind: ImagePolicy
      metadata:
        name: << inputs.name >>
        namespace: flux-system
      spec:
        imageRepositoryRef:
          name: << inputs.name >>
        filterTags:
          pattern: '^main-[0-9a-f]+-(?P<ts>[0-9]+)$'
          extract: '$ts'
        policy:
          numerical:
            order: asc
