---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: external-dns
spec:
  chart:
    spec:
      chart: external-dns
      version: 1.23.0
      sourceRef:
        kind: HelmRepository
        name: external-dns
  interval: 1h
  values:
    provider:
      name: cloudflare
    env:
      - name: CF_API_TOKEN
        valueFrom:
          secretKeyRef:
            name: cloudflare-api-token
            key: api-token
    sources:
      - ingress
    extraArgs:
      - --ingress-class=traefik
      - --cloudflare-proxied
    domainFilters:
      - arnovannieuwenhuyzen.com
      - greetvandewynckele.com
    policy: sync
    txtOwnerId: home-ops
    txtPrefix: "k8s."
