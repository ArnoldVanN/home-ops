---
apiVersion: notification.toolkit.fluxcd.io/v1
kind: Alert
metadata:
  name: flux
spec:
  providerRef:
    name: discord
  eventSeverity: error
  # Drop transient network blips (GitHub timeouts, source-controller restarting
  # during Flux upgrades). Flux retries these on the next interval and they
  # resolve on their own. kustomize reports a failed remote resource fetch as
  # "URL is a git repository" after it falls back to cloning the URL as git.
  exclusionList:
    - "i/o timeout"
    - "context deadline exceeded"
    - "TLS handshake timeout"
    - "connection refused"
    - "connection reset by peer"
    - "URL is a git repository"
  # Wildcard namespaces aren't supported, so every namespace with Flux objects is listed
  eventSources:
    - kind: GitRepository
      name: "*"
      namespace: flux-system
    - kind: OCIRepository
      name: "*"
      namespace: flux-system
    - kind: OCIRepository
      name: "*"
      namespace: kube-system
    - kind: OCIRepository
      name: "*"
      namespace: system-upgrade
    - kind: OCIRepository
      name: "*"
      namespace: database
    - kind: OCIRepository
      name: "*"
      namespace: observability
    - kind: OCIRepository
      name: "*"
      namespace: security
    - kind: ImageRepository
      name: "*"
      namespace: flux-system
    - kind: ImagePolicy
      name: "*"
      namespace: flux-system
    - kind: ImageUpdateAutomation
      name: "*"
      namespace: flux-system
    - kind: HelmRelease
      name: "*"
      namespace: flux-system
    - kind: HelmRelease
      name: "*"
      namespace: kube-system
    - kind: HelmRelease
      name: "*"
      namespace: network
    - kind: HelmRepository
      name: "*"
      namespace: network
    - kind: HelmRelease
      name: "*"
      namespace: system-upgrade
    - kind: HelmRelease
      name: "*"
      namespace: tailscale
    - kind: HelmRelease
      name: "*"
      namespace: database
    - kind: HelmRelease
      name: "*"
      namespace: observability
    - kind: HelmRelease
      name: "*"
      namespace: security
    - kind: HelmRepository
      name: "*"
      namespace: tailscale
    - kind: Kustomization
      name: "*"
      namespace: flux-system
    - kind: Kustomization
      name: "*"
      namespace: kube-system
    - kind: Kustomization
      name: "*"
      namespace: network
    - kind: Kustomization
      name: "*"
      namespace: observability
    - kind: Kustomization
      name: "*"
      namespace: system-upgrade
    - kind: Kustomization
      name: "*"
      namespace: tailscale
    - kind: Kustomization
      name: "*"
      namespace: web
    - kind: Kustomization
      name: "*"
      namespace: database
    - kind: Kustomization
      name: "*"
      namespace: security
