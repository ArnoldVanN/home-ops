---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tailscale-operator
spec:
  chart:
    spec:
      chart: tailscale-operator
      version: 1.104.2
      sourceRef:
        kind: HelmRepository
        name: tailscale
  interval: 1h
  install:
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
  # OAuth credentials come from the operator-oauth Secret (client_id, client_secret)
  values:
    operatorConfig:
      hostname: pi-home-operator
