---
apiVersion: upgrade.cattle.io/v1
kind: Plan
metadata:
  name: server-plan
spec:
  concurrency: 1
  cordon: true
  nodeSelector:
    matchExpressions:
      - key: node-role.kubernetes.io/control-plane
        operator: In
        values:
          - "true"
  serviceAccountName: system-upgrade
  upgrade:
    image: rancher/k3s-upgrade
  # (v1.34 -> v1.35 -> v1.36) before switching to the stable channel.
  channel: https://update.k3s.io/v1-release/channels/v1.34
  window:
    days:
      - monday
      - tuesday
      - wednesday
      - thursday
      - friday
      - saturday
      - sunday
    startTime: "03:00"
    endTime: "05:00"
    timeZone: Europe/Brussels
